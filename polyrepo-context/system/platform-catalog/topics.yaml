# SYNTHETIC example catalog entry written for an experiment.
ingestion.schema.discovered.v1:
  producer: ingestion-service
  consumers:
    - metadata-service
ingestion.batch.landed.v1:
  producer: ingestion-service
  consumers:
    - transformation-service
ingestion.job.completed.v1:
  producer: ingestion-service
  consumers:
    - lineage-service
metadata.dataset.changed.v1:
  producer: metadata-service
  consumers:
    - entitlements-service
    - lineage-service
    - search-indexer
transformation.result.published.v1:
  producer: transformation-service
  consumers:
    - metadata-service
    - notification-service
consumption.access.logged.v1:
  producer: consumption-gateway
  consumers:
    - usage-metering
