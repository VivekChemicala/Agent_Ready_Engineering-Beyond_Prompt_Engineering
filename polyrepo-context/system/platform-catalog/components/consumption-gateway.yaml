# SYNTHETIC example catalog entry written for an experiment.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: consumption-gateway
  description: "Serves query results to data consumers."
  annotations:
    github.com/project-slug: example-org/consumption-gateway
spec:
  type: service
  lifecycle: production
  owner: team-consumption
  system: data-platform
  providesApis:
    - query-api
  consumesApis:
    - entitlements-api
  dependsOn:
    - component:platform-sdk
  events:
    produces:
      - consumption.access.logged.v1
    consumes: []
