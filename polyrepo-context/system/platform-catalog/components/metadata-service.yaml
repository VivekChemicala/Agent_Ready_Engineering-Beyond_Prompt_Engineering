# SYNTHETIC example catalog entry written for an experiment.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: metadata-service
  description: "Metadata store of datasets, columns, owners and quality scores."
  annotations:
    github.com/project-slug: example-org/metadata-service
spec:
  type: service
  lifecycle: production
  owner: team-metadata
  system: data-platform
  providesApis:
    - metadata-service-api
  consumesApis: []
  dependsOn:
    - component:platform-sdk
  events:
    produces:
      - metadata.dataset.changed.v1
    consumes:
      - ingestion.schema.discovered.v1
      - transformation.result.published.v1
