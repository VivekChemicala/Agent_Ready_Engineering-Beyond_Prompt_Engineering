# SYNTHETIC example catalog entry written for an experiment.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ingestion-service
  description: "Source connectors; discovers source schemas and lands batches."
  annotations:
    github.com/project-slug: example-org/ingestion-service
spec:
  type: service
  lifecycle: production
  owner: team-ingest
  system: data-platform
  providesApis: []
  consumesApis: []
  dependsOn:
    - component:platform-sdk
  events:
    produces:
      - ingestion.schema.discovered.v1
      - ingestion.batch.landed.v1
      - ingestion.job.completed.v1
    consumes: []
