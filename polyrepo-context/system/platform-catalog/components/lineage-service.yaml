# SYNTHETIC example catalog entry written for an experiment.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: lineage-service
  description: "Builds dataset lineage from ingestion jobs."
  annotations:
    github.com/project-slug: example-org/lineage-service
spec:
  type: service
  lifecycle: production
  owner: team-discovery
  system: data-platform
  providesApis: []
  consumesApis: []
  dependsOn:
    - component:platform-sdk
  events:
    produces: []
    consumes:
      - ingestion.job.completed.v1
      - metadata.dataset.changed.v1
