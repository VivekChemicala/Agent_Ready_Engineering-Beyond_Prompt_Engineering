# SYNTHETIC example catalog entry written for an experiment.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dq-engine
  description: "Runs data-quality rules on landed batches."
  annotations:
    github.com/project-slug: example-org/dq-engine
spec:
  type: service
  lifecycle: production
  owner: team-quality
  system: data-platform
  providesApis:
    - dq-api
  consumesApis:
    - metadata-graph-api
  dependsOn:
    - component:platform-sdk
  events:
    produces:
      - dq.result.published.v1
    consumes:
      - ingestion.batch.landed.v1
