# SYNTHETIC example catalog entry written for an experiment.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: transformation-service
  description: "Runs transformation rules on landed batches."
  annotations:
    github.com/project-slug: example-org/transformation-service
spec:
  type: service
  lifecycle: production
  owner: team-transformation
  system: data-platform
  providesApis:
    - transformation-api
  consumesApis:
    - metadata-service-api
  dependsOn:
    - component:platform-sdk
  events:
    produces:
      - transformation.result.published.v1
    consumes:
      - ingestion.batch.landed.v1
